<div class="container my-5">

  <div class="mb-5">
    <h1 class="mb-3 text-center">Offers</h1>

    <div id="promoCarousel" class="carousel slide shadow-lg" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div 
          class="carousel-item" 
          *ngFor="let img of offerImages; let i = index" 
          [class.active]="i === 0"
        >
          <img 
            [src]="'http://localhost:3000' + img" 
            class="d-block w-100" 
            style="max-height:480px; object-fit:cover;"
          >
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#promoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#promoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

      <div class="carousel-indicators">
        <button 
          *ngFor="let img of offerImages; let i = index"
          type="button" 
          data-bs-target="#promoCarousel" 
          [attr.data-bs-slide-to]="i" 
          [class.active]="i === 0">
        </button>
      </div>
    </div>
  </div>

  <h2 class="mb-4 text-center">Our Top Products</h2>

  
  <div class="row g-4">
    <div class="col-sm-6 col-md-4" *ngFor="let product of products | slice:0:3">
      <div class="card h-100 shadow-lg border-0 product-card" style="transition: transform 0.2s;">
        <img 
          [src]="'http://localhost:3000' + (product.image || '/default-product.png')" 
          class="card-img-top" 
          alt="{{ product.name }}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-primary fw-bold mb-3">${{ product.price }}</p>
          <button class="btn btn-outline-primary mt-auto">
            <em>Add to cart</em>
          </button>
        </div>
      </div>
    </div>
  </div>


</div>

<style>
  .product-card:hover {
    transform: translateY(-5px);
  }
</style>
