<div *ngFor="let order of orders" class="card mb-4 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="card-title mb-0">Order #{{ order.id }} (User ID: {{ order.user_id }})</h5>

      <select class="form-select w-auto"
              [(ngModel)]="order.status"
              (change)="updateStatus(order)">
        <option [value]="2">Completed</option>
        <option [value]="1">Pending</option>
        <option [value]="0">Canceled</option>
      </select>
    </div>

    <p class="mb-2"><strong>Total:</strong> {{ order.total }} MDL</p>

    <div *ngIf="order.products.length">
      <h6>Items:</h6>
      <ul class="list-group list-group-flush">
        <li *ngFor="let item of order.products" class="list-group-item d-flex align-items-center">
          <img *ngIf="item.images.length"
               [src]="'http://localhost:3000' + item.images[0]"
               class="me-3 rounded"
               width="60" alt="{{ item.name }}">
          <div>
            <strong>{{ item.name }}</strong><br>
            {{ item.quantity }} x {{ item.price }} MDL
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
