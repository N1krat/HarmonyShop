<div *ngFor="let order of orders" class="card mb-4 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="card-title mb-1">Order #{{ order.id }}</h5>
        <p class="text-muted mb-0 small">User ID: {{ order.user_id }}</p>
      </div>

      <select class="form-select w-auto"
              [(ngModel)]="order.status"
              (change)="updateStatus(order)">
        <option value="Completed">Completed</option>
        <option value="Pending">Pending</option>
        <option value="Canceled">Canceled</option>
      </select>
    </div>

    <p class="mb-3"><strong>Total:</strong> MDL {{ order.total }}</p>

    <div *ngIf="order.products && order.products.length">
      <h6 class="mb-3">Items:</h6>
      <ul class="list-group list-group-flush">
        <li *ngFor="let item of order.products" class="list-group-item d-flex justify-content-between align-items-center py-3">
          <div class="d-flex align-items-center">
            <img *ngIf="item.images && item.images.length > 0"
                 [src]="'http://localhost:3000' + item.images[0]"
                 class="me-3 rounded"
                 width="60" 
                 height="60"
                 style="object-fit: cover;"
                 alt="{{ item.name }}">
            <div>
              <strong>{{ item.name }}</strong><br>
              <span class="text-muted small">{{ item.category }}</span>
            </div>
          </div>
          <div class="text-end">
            <p class="mb-0"><span class="badge bg-primary">Qty: {{ item.quantity }}</span></p>
            <p class="mb-0">MDL {{ item.price }}</p>
          </div>
        </li>
      </ul>
    </div>

    <div *ngIf="!order.products || order.products.length === 0" class="alert alert-warning mb-0 mt-3">
      No items in this order
    </div>
  </div>
</div>
