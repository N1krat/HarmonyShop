<div class="container-fluid mt-5">
  <div class="row">
    <!-- Sidebar Filters -->
    <div class="col-md-3">
      <div class="card shadow-sm p-4 rounded">
        <h5 class="mb-4 fw-bold">🔍 Filters</h5>

        <!-- Category Filter -->
        <div class="mb-4">
          <label class="form-label fw-bold">Category</label>
          <select class="form-select" [(ngModel)]="selectedCategory" (change)="applyFilters()">
            <option value="">All Categories</option>
            <option *ngFor="let cat of categories" [value]="cat">
              {{ cat }}
            </option>
          </select>
        </div>

        <!-- Price Range Filter -->
        <div class="mb-4">
          <label class="form-label fw-bold">Price Range</label>
          <div class="mb-2">
            <label class="form-label">Min: MDL {{ minPrice }}</label>
            <input 
              type="range" 
              class="form-range" 
              min="0" 
              max="10000" 
              [(ngModel)]="minPrice" 
              (change)="applyFilters()"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Max: MDL {{ maxPrice }}</label>
            <input 
              type="range" 
              class="form-range" 
              min="0" 
              max="10000" 
              [(ngModel)]="maxPrice" 
              (change)="applyFilters()"
            />
          </div>
        </div>

        <!-- Reset Filters Button -->
        <button class="btn btn-outline-secondary w-100" (click)="resetFilters()">
          Reset Filters
        </button>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="col-md-9">
      <div class="mb-4">
        <h3 class="fw-bold">Products</h3>
        <p class="text-muted" *ngIf="searchQuery">Searching for: <strong>{{ searchQuery }}</strong></p>
        <p class="text-muted">Showing {{ filteredProducts.length }} products</p>
      </div>

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div *ngIf="!loading && filteredProducts.length === 0" class="text-center py-5">
        <p class="fs-5 text-muted">No products found. Try adjusting your filters.</p>
      </div>

      <div class="row g-4" *ngIf="!loading && filteredProducts.length > 0">
        <div class="col-md-6 col-lg-4" *ngFor="let product of filteredProducts">
          <div class="card h-100 shadow-sm border-0 rounded-4 product-card">

            <div class="image-wrapper rounded-top-4" (click)="openProduct(product.id!)" style="cursor:pointer">
              <img
                *ngIf="product.images && product.images.length > 0"
                [src]="'http://localhost:3000' + product.images[0]"
                alt="product image"
              />
            </div>
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold mb-2">{{ product.name }}</h5>
              
              <p class="text-muted small mb-2">
                <span class="badge bg-secondary">{{ product.category }}</span>
              </p>

              <p class="text-muted small mb-2">
                ⭐ Rating: {{ product.rating || 'N/A' }}
              </p>

              <p class="text-primary fw-bold fs-4 mb-3">
                MDL {{ product.price }}
              </p>
              <button class="btn btn-success mt-auto w-100 fw-semibold"
                (click)="addToCart(product); $event.stopPropagation();">
                Add to Cart
              </button>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>
</div>
