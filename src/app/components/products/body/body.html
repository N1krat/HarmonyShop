<div class="container mt-5">
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm border-0 rounded-4 product-card">

        <div class="image-wrapper rounded-top-4" (click)="openProduct(product.id!)" style="cursor:pointer">
          <img
            *ngIf="product.images && product.images.length > 0"
            [src]="'http://localhost:3000' + product.images[0]"
            alt="product image"
          />
        </div>
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold mb-2">{{ product.name }}</h5>

          <p class="text-primary fw-bold fs-4 mb-3">
            ${{ product.price }}
          </p>
          <button class="btn btn-success mt-auto w-100 fw-semibold"
            (click)="addToCart(product); $event.stopPropagation();">
            Add to Cart
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
