<div class="container mt-5">
  <h2 class="mb-4 text-center">Your Cart</h2>

  <div *ngIf="cartItems.length === 0" class="text-center py-5 shadow rounded p-4 bg-white">
    <p class="fs-5">Your cart is empty.</p>
    <a routerLink="/products" class="btn btn-primary btn-lg">Go to Shop</a>
  </div>

  <div *ngIf="cartItems.length > 0" class="shadow p-3 rounded bg-white">
    <div class="row g-3 mb-4 p-2 shadow-sm rounded bg-light" *ngFor="let item of cartItems">
      <div class="col-md-3">
        <div class="card shadow-sm h-100 rounded">
          <img 
            [src]="'http://localhost:3000' + item.image" 
            alt="{{ item.name }}" 
            class="img-fluid rounded"
          />
        </div>
      </div>
      <div class="col-md-9 d-flex flex-column justify-content-between">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">{{ item.name }}</h5>
          <button class="btn btn-sm btn-outline-danger" (click)="remove(item)" [disabled]="isCheckingOut">Remove</button>
        </div>

        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <button class="btn btn-sm btn-outline-secondary me-2" (click)="decrease(item)" [disabled]="isCheckingOut">-</button>
            <span class="fw-bold mx-1">{{ item.quantity }}</span>
            <button class="btn btn-sm btn-outline-secondary ms-2" (click)="increase(item)" [disabled]="isCheckingOut">+</button>
          </div>
          <h5 class="text-primary mb-0">MDL {{ item.price * item.quantity }}</h5>
        </div>
      </div>
    </div>

    <div class="card shadow-lg p-3 mt-3 rounded bg-white">
      <div class="d-flex justify-content-between align-items-center">
        <h4>Total: MDL {{ totalPrice.toFixed(2) }}</h4>
        <button 
          class="btn btn-success btn-lg" 
          (click)="checkout()"
          [disabled]="isCheckingOut"
        >
          {{ isCheckingOut ? 'Processing...' : 'Checkout' }}
        </button>
      </div>
    </div>
  </div>
</div>
