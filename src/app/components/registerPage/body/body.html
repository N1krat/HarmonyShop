<div class="auth-page">
  <div class="card shadow-lg p-4 auth-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold">{{ 'auth.registerTitle' | translate }}</h2>
    </div>

    <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success text-center">{{ success }}</div>

    <form (ngSubmit)="submitRegister()">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">{{ 'auth.email' | translate }}</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">{{ 'auth.password' | translate }}</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
        {{ 'auth.registerButton' | translate }}
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">
        {{ 'auth.hasAccount' | translate }}
        <a routerLink="/login">{{ 'auth.loginLink' | translate }}</a>
      </small>
    </div>
  </div>
</div>
