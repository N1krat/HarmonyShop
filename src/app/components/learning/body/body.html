<div class="learning-page">


  <div class="learning-container">
    <div class="container-fluid">
      <div class="page-title-section mb-5">
        <h2 class="page-title">{{ 'learning.chooseInstrument' | translate }}</h2>
        <p class="page-subtitle">{{ 'learning.subtitle' | translate }}</p>
      </div>

      <div class="instruments-grid">
        <div *ngFor="let instrument of instruments"
             class="instrument-card"
             [style.--card-color]="instrument.color"
             (click)="selectInstrument(instrument)">
          <div class="card-front">
            <div class="card-icon">{{ instrument.icon }}</div>
            <h3 class="card-title">{{ instrument.nameKey | translate }}</h3>
            <p class="card-subtitle">{{ instrument.modules }} {{ 'learning.modules' | translate }}</p>
          </div>
          <div class="card-back">
            <p class="card-description">{{ instrument.descriptionKey | translate }}</p>
            <button class="card-button">{{ 'learning.startLearning' | translate }} →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
