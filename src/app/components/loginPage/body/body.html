<div class="auth-page">
  <div class="card shadow-lg p-4 auth-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold">{{ 'auth.loginTitle' | translate }}</h2>
      <p class="text-muted">{{ 'auth.loginSubtitle' | translate }}</p>
    </div>

    <div *ngIf="error" class="alert alert-danger text-center">
      {{ error }}
    </div>

    <form (ngSubmit)="submitLogin()">
      <div class="mb-3">
        <label>{{ 'auth.email' | translate }}</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control form-control-lg" required>
      </div>

      <div class="mb-4">
        <label>{{ 'auth.password' | translate }}</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control form-control-lg" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        {{ 'auth.loginButton' | translate }}
      </button>

      <div class="text-center mt-3">
        <small class="text-muted">
          {{ 'auth.noAccount' | translate }}
          <a routerLink="/register">{{ 'auth.registerLink' | translate }}</a>
        </small>
      </div>
    </form>
  </div>
</div>
